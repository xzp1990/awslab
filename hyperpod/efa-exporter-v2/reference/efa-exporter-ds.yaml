apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: efa-exporter
  namespace: default
  labels:
    app: efa-exporter
spec:
  selector:
    matchLabels:
      app: efa-exporter
  template:
    metadata:
      labels:
        app: efa-exporter
    spec:
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - ml.g5.8xlarge
                      - ml.p5en.48xlarge
                      - ml.p5e.48xlarge
                      - ml.p6-b300.48xlarge
                      - ml.p5.48xlarge
      tolerations:
        - operator: Exists
      containers:
        - name: efa-exporter
          image: 296578399912.dkr.ecr.ap-southeast-3.amazonaws.com/hyperpod/efa_exporter:1.0.0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=0.0.0.0:9119
            - --collector.disable-defaults
            - --collector.amazonefa
          ports:
            - containerPort: 9119
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
