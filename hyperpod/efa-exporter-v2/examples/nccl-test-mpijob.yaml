apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-test-efa
spec:
  runPolicy:
    cleanPodPolicy: Running
    backoffLimit: 3
  slotsPerWorker: 1
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          tolerations:
            - operator: Exists
          restartPolicy: OnFailure
          containers:
            - image: public.ecr.aws/hpc-cloud/nccl-tests:latest
              imagePullPolicy: Always
              name: nccl-launcher
              resources:
                limits:
                  cpu: "2"
                  memory: "4Gi"
                requests:
                  cpu: "1"
                  memory: "2Gi"
              env:
                - name: PATH
                  value: $PATH:/opt/amazon/efa/bin:/usr/bin
                - name: LD_LIBRARY_PATH
                  value: /opt/amazon/ofi-nccl/lib/x86_64-linux-gnu:/opt/amazon/openmpi/lib64/:/opt/amazon/efa/lib64:/opt/amazon/ofi-nccl/lib64/:/opt/amazon/openmpi/lib:/opt/nccl/build/lib:/opt/amazon/efa/lib:/opt/aws-ofi-nccl/install/lib:/usr/local/nvidia/lib:$LD_LIBRARY_PATH
                - name: NCCL_DEBUG
                  value: INFO
              command:
                - /opt/amazon/openmpi/bin/mpirun
                - --allow-run-as-root
                - --tag-output
                - -np
                - "2"
                - -N
                - "1"
                - --bind-to
                - none
                - -x
                - PATH
                - -x
                - LD_LIBRARY_PATH
                - -x
                - NCCL_DEBUG=INFO
                - -x
                - FI_PROVIDER=efa
                - -x
                - FI_EFA_USE_DEVICE_RDMA=1
                - --mca
                - pml
                - ^cm,ucx
                - --mca
                - btl
                - tcp,self
                - --mca
                - btl_tcp_if_exclude
                - lo,docker0,veth_def_agent
                - /opt/nccl-tests/build/all_reduce_perf
                - -b
                - "8"
                - -e
                - "256M"
                - -f
                - "2"
                - -g
                - "1"
                - -c
                - "1"
                - -n
                - "20"
    Worker:
      replicas: 2
      template:
        spec:
          nodeSelector:
            node.kubernetes.io/instance-type: "ml.g6e.8xlarge"
          tolerations:
            - operator: Exists
          containers:
            - image: public.ecr.aws/hpc-cloud/nccl-tests:latest
              imagePullPolicy: Always
              name: nccl-worker
              volumeMounts:
                - name: shmem
                  mountPath: /dev/shm
              resources:
                limits:
                  nvidia.com/gpu: 1
                  vpc.amazonaws.com/efa: 1
                  memory: 8Gi
                requests:
                  nvidia.com/gpu: 1
                  vpc.amazonaws.com/efa: 1
                  memory: 8Gi
          volumes:
            - name: shmem
              hostPath:
                path: /dev/shm
